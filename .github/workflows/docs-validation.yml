name: Docs Validation

# Enforces the repository's documentation rules on every pull request and push to
# master. SECRETS / PII / dead-links are checked across the whole tree; FORMAT and
# HYGIENE are enforced on the files changed in the PR (a ratchet — new/edited docs
# must comply, without failing on the pre-existing backlog). See .github/validate_docs.py.

on:
  # NO path filter on pull_request, deliberately. `CI Gate` is a required status check,
  # and a required check that never REPORTS leaves a PR stuck on "Expected — Waiting for
  # status" forever — with enforce_admins on there is no bypass, so main would become
  # unmergeable. The workflow therefore always runs; `validate` itself is cheap and
  # no-ops when a PR touches no docs.
  pull_request:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/validate_docs.py"
      - ".github/pii-denylist.txt"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Pin validator to base (a PR cannot weaken its own gate)
        run: |
          git fetch origin "${{ github.base_ref || 'master' }}" --depth=1
          git checkout FETCH_HEAD -- .github/validate_docs.py .github/pii-denylist.txt 2>/dev/null \
            || echo "validator not yet on base (bootstrap) — using PR copy"
      - name: Determine changed docs
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          git fetch origin "${{ github.base_ref || 'master' }}" --depth=1 2>/dev/null || true
          CHANGED=$(git diff --name-only --diff-filter=d "$BASE" HEAD -- 'docs/**/*.md' 2>/dev/null | tr '\n' ' ')
          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Changed docs: ${CHANGED:-<none>}"
      - name: Validate documentation (format · links · secrets · PII · hygiene)
        run: python3 .github/validate_docs.py --scoped ${{ steps.changed.outputs.files }}

  # The required status check. Aggregates so that exactly one context must be green,
  # and reports on EVERY pull request regardless of what the PR touched.
  # `skipped` counts as pass; only a real failure or cancellation blocks.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          r="${{ needs.validate.result }}"
          echo "validate: $r"
          case "$r" in
            success|skipped) echo "gate: pass" ;;
            *) echo "gate: FAIL"; exit 1 ;;
          esac
